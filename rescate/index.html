<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Uso interno</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body style="font-family:system-ui,Arial,sans-serif;margin:24px;color:#0f2a52;max-width:560px">
<h1>Completar estructura del año 2025</h1>
<p>Página temporal de uso interno. Agrega a /archivos/2025 las llaves vacías que la plataforma espera (asistencia, extra, cierres, tareas), sin tocar estudiantes, cursos, nómina ni perfiles.</p>
<label>Usuario<br><input id="usu" value="andres" style="width:100%;padding:8px;margin:4px 0 12px"></label>
<label>Clave<br><input id="cla" type="password" style="width:100%;padding:8px;margin:4px 0 12px"></label>
<button id="btn" style="background:#1d4ed8;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:16px;width:100%">Ingresar y completar estructura 2025</button>
<p id="estado" style="font-size:18px;font-weight:600;margin-top:18px">Listo para empezar.</p>
<script>
const FB_CONFIG = { apiKey: "AIzaSyD8JESH5rhMkgmSjy-0h6p-zObQg-XAzQ0", authDomain: "plataforma-cemi.firebaseapp.com", databaseURL: "https://plataforma-cemi-default-rtdb.firebaseio.com", projectId: "plataforma-cemi", storageBucket: "plataforma-cemi.firebasestorage.app", messagingSenderId: "59598932057", appId: "1:59598932057:web:24cb8ee45a831374a4c948" };
firebase.initializeApp(FB_CONFIG);
const db = firebase.database(), auth = firebase.auth(), est = document.getElementById('estado');
function decir(t){ est.textContent = t; document.title = t; }
document.getElementById('btn').onclick = async () => {
  try{
    const usu = document.getElementById('usu').value.trim().toLowerCase();
    const cla = document.getElementById('cla').value;
    const s = await db.ref('loginMap/' + usu).once('value');
    const correo = s.val(); if(!correo){ decir('Usuario no encontrado en loginMap.'); return; }
    decir('Ingresando...');
    await auth.signInWithEmailAndPassword(correo, cla);
    decir('Leyendo /archivos/2025...');
    const snap = await db.ref('archivos/2025').once('value');
    const obj = snap.val(); if(!obj){ decir('ERROR: /archivos/2025 no existe.'); return; }
    const defs = { asistencia:{}, extra:{}, cierres:{}, tareas:[], parciales:{}, notas:{}, observadores:{}, planeadores:{} };
    const agregadas = [];
    Object.keys(defs).forEach(k=>{ if(obj[k] === undefined){ obj[k] = defs[k]; agregadas.push(k); } });
    decir('Agregando llaves: ' + (agregadas.join(', ') || 'ninguna') + '...');
    await db.ref('archivos/2025').set(obj);
    const v = (await db.ref('archivos/2025').once('value')).val();
    const ne = (v.estudiantes || []).length;
    const nm = (v.estudiantes || []).filter(e=>e.cursoId==='c-maternal').length;
    const nc = (v.cursos || []).length;
    const np = (v.perfiles || []).length;
    decir('LISTO: estructura completa. Estudiantes: ' + ne + ' (MATERNAL: ' + nm + ') · Cursos: ' + nc + ' · Perfiles: ' + np + ' · Llaves agregadas: ' + (agregadas.join(', ') || 'ninguna'));
  }catch(e){ decir('ERROR: ' + (e && e.message ? e.message : e)); }
};
</script>
</body></html>
